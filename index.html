<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./styles/main.css">
  <!-- space mono font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Tip calculator app</title>


</head>
<body>

  <main>

    <img 
      src="./images/logo.svg" 
      alt="Splitter" 
      class="site-logo"
    >

    <form class="tip-calculator">
      
      <section 
        class="bill-section" 
        aria-label="bill-Details"
      >
        
        <div class="form-control">
      
          <label for="bill-input">Bill</label>
      
          <div class="input-container">

            <img 
              src="./images/icon-dollar.svg" 
              alt="" 
              aria-hidden="true"
            >
            
            <input 
              type="number" 
              id="bill-input" 
              placeholder="0" 
              name="bill"
              min="0"
              step="any"
            >

          </div>
      
        </div>
        
        <fieldset class="tip-section">
          
          <legend class="tip-selection__label">Select Tip %</legend>

          <div class="tip-options">
            <label class="tip-option">
              <input 
                type="radio" 
                name="tip" 
                value="5"
              >
              <span>5%</span>
            </label>

            <label class="tip-option">
              <input 
                type="radio" 
                name="tip" 
                value="10"
              >
              <span>10%</span>
            </label>
            
            <label class="tip-option">
              <input 
                type="radio" 
                name="tip" 
                value="15"
              >
              <span>15%</span>
            </label>
            
            <label class="tip-option">
              <input 
                type="radio" 
                name="tip" 
                value="25"
              >
              <span>25%</span>
            </label>
            
            <label class="tip-option">
              <input 
                type="radio" 
                name="tip" 
                value="50"
              >
              <span>50%</span>
            </label>

            <input 
              type="number"
              name="tip"
              placeholder="Custom"
              aria-label="Custom tip percentage"
              min="0"
              max="100"
              step="any"
              inputmode="decimal"
            >

          </div>
        </fieldset>
        
        <div class="form-control">
          
          <label for="people">Number of People</label>
          
          <div class="input-container">

            <img 
              src="./images/icon-person.svg" 
              alt="" 
              aria-hidden="true"
            >
            
            <input 
              type="number" 
              id="people"
              name="people" 
              min="1" 
              max="100" 
              step="1" 
              placeholder="0"
            >

          </div>
          
        </div>

      </section>
      
      <section 
        class="results-section"
        aria-label="Calculation results"  
      >

        <div class="results-container">
          
          <div class="result">
            
            <div class="result-label">
              <span id="tip-amount-label">Tip Amount</span>
              <span id="tip-amount-unit">/person</span>
            </div>

            <output
              id="tip-amount"
              class="result-value"
              aria-labelledby="tip-amount-label tip-amount-unit"
            >
              $4.27
            </output>

          </div>

          <div class="result">
            
            <div class="result-label">
              
              <span id="total-label">Total</span>
              <span id="total-unit">/person</span>

            </div>

            <output
              id="total-amount"
              class="result-value"
              aria-labelledby="total-label total-unit"
            >
              $32.79
            </output>

          </div>
          
        </div>
        
        <button 
          class="reset-button" 
          type="reset"
          disabled
        >
          RESET
        </button>

      </section>

    </form>

  </main>
  
</body>
</html>
