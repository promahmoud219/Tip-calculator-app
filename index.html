<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./styles/main.css">
  <!-- space mono font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Tip calculator app</title>


</head>
<body>

  <main>

    <header>
      <img src="./images/logo.svg" alt="Splitter" class="site-logo">
    </header>

    <div class="tip-calculator">
      
      <section class="bill-section">
        
        <div class="bill-input">
      
          <label for="bill-input">Bill</label>
      
          <div class="input-container">
            <img src="./images/icon-dollar.svg" alt="">
            <input type="number" id="bill-input" placeholder="0" >
          </div>
      
        </div>
        
        <div class="tip-selection">
          
          <span class="tip-selection__label">Select Tip %</span>
          
            <div class="tip-selection__options">
            
              <div class="tip-button">5%</div>
              <div class="tip-button">10%</div>
              <div class="tip-button">15%</div>
              <div class="tip-button">25%</div>
              <div class="tip-button">50%</div>
              
              <div class="custom-tip-input">
                <input type="number" placeholder="Custom">
              </div>

            </div>

        </div>
        
        <div class="number-of-people-input">
          
          <label for="">Number of People</label>
          
          <div class="input-container">
            <img src="./images/icon-person.svg" alt="">
            <input type="number" placeholder="0">
          </div>
          
        </div>

      </section>
      
      <section class="results-card">

        <div class="results-card__summary">
          
          <div class="result-item">
            
            <div class="result-item__name" aria-labelledby="tip-amount-label tip-amount-unit">
              <span id="tip-amount-label">Tip Amount</span>
              <span id="tip-amount-unit">/person</span>
            </div>
            
            <div class="result">
              <img src="./images/icon-dollar.svg" alt="">
              <span>0.00</span>
            </div>
            
          </div>
          
          <div class="result-item">
            
            <div class="result-item__name" >
              <span id="tip-amount-label">Tip Amount</span>
              <span id="tip-amount-unit">/person</span>
            </div>

            <div class="result">
              <img src="./images/icon-dollar.svg" alt="">
              <span>0.00</span>
            </div>

          </div>

        </div>
        
        <button class="reset-button" type="reset">RESET</button>

      </section>

    </div>
  </main>
  
</body>
</html>
